# IP REAL do visitante. A cadeia é: visitante → Cloudflare → Traefik → este nginx → motor.
# Neste ponto $remote_addr já é o IP do TRAEFIK (contêiner), não o de quem acessou — por isso o
# X-Real-IP que existia aqui mandava um IP privado. Quem sabe o IP verdadeiro é o cabeçalho:
# CF-Connecting-IP (Cloudflare) ou o PRIMEIRO item do X-Forwarded-For.
map $http_x_forwarded_for $zc_xff_primeiro {
    ~^(?P<primeiro>[^,\s]+)  $primeiro;
    default                   "";
}
map $http_cf_connecting_ip $zc_ip_real {
    ""       $zc_xff_primeiro;
    default  $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Links de grupo do WhatsApp atrás de uma URL nossa: a Meta recusa botão de template apontando
    # direto pra chat.whatsapp.com ("Os botões não podem conter links diretos para o WhatsApp", 13/10).
    # Trocar o grupo = trocar só aqui; os templates aprovados continuam valendo.

    # URLs SEM .html: /afiliados serve afiliados.html (o .html "feio" some da barra).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Contador do workshop: o motor responde por trás, NA MESMA ORIGEM. Evita CORS (o motor não tem
    # cabeçalho de CORS) e não expõe app.seudominio.com.br no HTML da página.
    # O nome do motor vai numa VARIÁVEL de propósito: com nome literal o nginx resolve o DNS ao subir e
    # se RECUSA A INICIAR quando o motor ainda não está de pé — o site inteiro cairia por causa do contador.
    location ~ ^/api/workshop/(.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $motor app;
        proxy_pass http://$motor:3333/public/workshop/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $zc_ip_real;
        # O motor só confia em IP repassado neste cabeçalho quando a requisição NÃO traz carimbo de
        # proxy de borda (ver clientIp no server.ts) — é o que permite mandar o IP certo pra Meta
        # CAPI sem abrir brecha pra alguém forjar o próprio IP de fora.
        proxy_set_header X-Zc-Client-Ip $zc_ip_real;
        # ⚠️ OBRIGATÓRIO, e é o par do clientIp lá no motor: o Traefik carimba estes cabeçalhos
        # ANTES de chegar aqui, e o nginx repassa tudo que recebeu por padrão. Se eles seguirem
        # adiante, o motor lê "veio da borda pública", descarta o X-Zc-Client-Ip acima e TODO
        # visitante da VSL cai no mesmo balde de rate-limit (429 em massa depois de 40 acessos) —
        # além de perder o IP real na Meta CAPI. Valor vazio no nginx = "não repasse este header".
        proxy_set_header X-Forwarded-Proto  "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Host   "";
        proxy_set_header X-Forwarded-Port   "";
        proxy_set_header X-Forwarded-For    "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        # Motor fora do ar não pode derrubar a página: o JS trata o erro e mostra o texto neutro.
        proxy_intercept_errors off;
    }

    # LINK DIRETO DE PLANO: /planos, /planos/anual, /planos/anual/profissional… todos servem a
    # HOME, e o JS lê o caminho pra já abrir no ciclo certo com o plano em destaque. É o link que
    # o dono manda pro cliente no meio da negociação ("já cai no anual, no Profissional").
    # ^~ vence os regex abaixo (senão o redirect de .html poderia pegar antes).
    location ^~ /planos {
        # @home (named location) e NÃO /index.html: o try_files com URI faz um redirecionamento
        # INTERNO que volta a passar pela seleção de location — e a regra de tirar ".html" da URL
        # capturava, devolvendo 301 pra /index. O link do plano abria a home sem o caminho, então
        # o JS não tinha o que ler e o cliente caía no mensal (produção, 20/08).
        # Named location é invisível pra regex: serve o arquivo e acabou.
        try_files $uri @home;
    }
    location @home {
        try_files /index.html =404;
    }

    # Arte e vídeo: cache no navegador, então quem volta à página não baixa de novo.
    # Só "expires" de propósito — um add_header aqui dentro APAGARIA os headers de segurança
    # herdados do server (nginx substitui, não soma), e o nosniff é justamente o que faz a
    # logo .webp quebrar se o tipo vier errado.
    location ~* \.(png|jpe?g|webp|gif|svg|ico|mp4|webm|woff2?)$ {
        expires 7d;
    }

    # /qualquer.html → redireciona 301 pra a versão sem .html (canônico, e quem tem link antigo cai certo).
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # Headers de segurança básicos no site estático (antes não tinha nenhum).
    # Nenhum arquivo oculto é servido (.env, .git, .htaccess…), mesmo que entre na imagem por engano.
    location ~ /\. { deny all; return 404; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: o site redireciona http→https, mas a PRIMEIRA visita ainda sai em texto claro e dá pra
    # interceptar numa rede hostil. Sem "preload" de propósito — preload é praticamente irreversível.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP: a segunda tranca das páginas de afiliado, que são GERADAS a partir de dado que o próprio
    # afiliado digita (ids de pixel, links). Hoje a defesa é o escape na geração; se um campo novo
    # esquecer o escape, a CSP ainda barra script externo. 'unsafe-inline' é obrigatório aqui — TODO
    # script destas páginas é inline (nenhuma tag tem src externo), então tirar isso quebra o site.
    # Google (GTM/GA4/Ads, 12/10/2026): sem esses domínios o navegador baixava o gtm.js e RECUSAVA
    # executar — o Analytics nunca recebia nada. frame-src: noscript do GTM + remarketing do Ads + player do
    # YouTube (página de obrigado, 16/10/2026; script-src ganhou youtube.com/s.ytimg.com pra API do player).
    # 18/10/2026: connect-src ganhou analytics.google.com (o GA4 manda o /g/collect pro domínio SEM
    # subdomínio, que o *.analytics.google.com não cobre) e ad.doubleclick.net (conversão do Google Ads,
    # /ccm/s/collect): o navegador recusava os dois e o GA4/Ads perdiam as visitas das páginas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com https://connect.facebook.net https://www.googletagmanager.com https://*.googletagmanager.com https://*.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://www.facebook.com https://connect.facebook.net https://*.google-analytics.com https://*.analytics.google.com https://analytics.google.com https://*.googletagmanager.com https://www.google.com https://*.g.doubleclick.net https://ad.doubleclick.net https://www.googleadservices.com https://pagead2.googlesyndication.com https://cloudflareinsights.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://www.googletagmanager.com https://td.doubleclick.net https://*.doubleclick.net https://www.google.com; frame-ancestors 'self'; base-uri 'none'; form-action 'self' https://pay.kiwify.com.br https://dashboard.kiwify.com; object-src 'none'" always;
}
